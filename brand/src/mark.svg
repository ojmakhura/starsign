<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <title>StarSign</title>
  <defs>
    <linearGradient id="ss-star" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.55" stop-color="#0284c7"/>
      <stop offset="1" stop-color="#075985"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="192" height="192" rx="42" fill="#0f172a" stroke="#334155" stroke-width="4"/>
  <g transform="translate(0 2)">
    <!-- orbit, back half -->
    <ellipse cx="103" cy="112" rx="60" ry="17" transform="rotate(-35 103 112)" fill="none" stroke="#38bdf8" stroke-width="6.5"/>
    <!-- four-point star -->
    <path d="M100 36 C101 60 104 70 134 96 C106 121 102 130 100 156 C98 130 94 121 66 96 C96 70 99 60 100 36 Z" fill="url(#ss-star)"/>
    <!-- orbit, front arc crossing the star -->
    <path d="M114 64 Q84 100 53 140" stroke="#38bdf8" stroke-width="7" stroke-linecap="round" fill="none"/>
    <circle cx="100" cy="98" r="9.5" fill="#ffffff"/>
  </g>
  <circle cx="145" cy="55" r="5.5" fill="#f59e0b"/>
</svg>
