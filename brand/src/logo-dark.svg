<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 240" width="860" height="240">
  <title>StarSign — Secure digital signatures &amp; audit</title>
  <g transform="translate(20 20)">
  <defs>
    <linearGradient id="ss-star-dark" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.55" stop-color="#0284c7"/>
      <stop offset="1" stop-color="#075985"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="192" height="192" rx="42" fill="#0f172a" stroke="#475569" stroke-width="4"/>
  <g transform="translate(0 2)">
    <!-- orbit, back half -->
    <ellipse cx="103" cy="112" rx="60" ry="17" transform="rotate(-35 103 112)" fill="none" stroke="#38bdf8" stroke-width="6.5"/>
    <!-- four-point star -->
    <path d="M100 36 C101 60 104 70 134 96 C106 121 102 130 100 156 C98 130 94 121 66 96 C96 70 99 60 100 36 Z" fill="url(#ss-star-dark)"/>
    <!-- orbit, front arc crossing the star -->
    <path d="M114 64 Q84 100 53 140" stroke="#38bdf8" stroke-width="7" stroke-linecap="round" fill="none"/>
    <circle cx="100" cy="98" r="9.5" fill="#ffffff"/>
  </g>
  <circle cx="145" cy="55" r="5.5" fill="#f59e0b"/>
</g>
  <text x="252" y="136" font-family="Liberation Sans" font-weight="bold" font-size="96" letter-spacing="-3"><tspan fill="#f8fafc">Star</tspan><tspan fill="#38bdf8">Sign</tspan></text>
  <text x="256" y="190" font-family="Liberation Sans" font-weight="bold" font-size="21" letter-spacing="5.2" fill="#94a3b8">SECURE DIGITAL SIGNATURES &amp; AUDIT</text>
</svg>
