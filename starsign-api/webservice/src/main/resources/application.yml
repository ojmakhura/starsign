server:
  port: ${PORT:8085}
  # Client IP from X-Forwarded-For only when the proxy is on a private network (Tomcat RemoteIpValve)
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:native}
  servlet:
    context-path: ${CONTEXT_PATH:/}
  http2:
    enabled: true
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
    min-response-size: 1024

logging:
  level:
    org:
      springframework: ${SPRING_LOGGING:INFO}
      hibernate: ${HIBERNATE_LOGGING:INFO}
    bw:
      co:
        starsign: ${APP_LOGGING:INFO}
spring:
  application:
    name: starsign
    # Filled in from the Maven project version at build time (Spring Boot parent resource filtering)
    version: "@project.version@"
  threads:
    virtual:
      # The runtime image is Java 25, where synchronized blocks no longer pin the carrier threads
      enabled: ${SPRING_THREADS_VIRTUAL_ENABLED:true}
  mvc:
    format:
      date: iso
      date-time: iso
      time: HH:mm:ss
  servlet:
    multipart:
      # PDF uploads; the per-organisation limit (OrganisationSigningPolicy.maxUploadSizeMb) is checked in DocumentService
      max-file-size: ${MAX_UPLOAD_SIZE:50MB}
      max-request-size: ${MAX_UPLOAD_SIZE:50MB}
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/starsign}
    username: ${DB_USERNAME:starsign}
    password: ${DB_PASSWORD:starsign}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    generate-ddl: ${GENERATE_DDL:false}
    hibernate:
      # Hibernate creates the schema; the Liquibase changelog runs after it (bw.co.starsign.config.LiquibaseConfig)
      ddl-auto: update
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
  liquibase:
    enabled: false

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH_URL:http://localhost:8080}/realms/${REALM:starsign}
          # Only tokens meant for this API (the portal clients add it with an audience mapper)
          audiences: ${API_CLIENT_ID:starsign-api}
  cloud:
    aws:
      # S3-compatible object storage (SeaweedFS S3 gateway locally); used by bw.co.starsign.storage.ObjectStorageAdapterImpl
      credentials:
        access-key: ${S3_ACCESS_KEY:starsign}
        secret-key: ${S3_SECRET_KEY:starsign-secret}
      region:
        static: ${S3_REGION:us-east-1}
      s3:
        endpoint: ${S3_ENDPOINT:http://localhost:8333}
        path-style-access-enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      # Milliseconds, or a duration such as 2s
      timeout: ${REDIS_TIMEOUT:100}
management:
  # Actuator runs on its own port so health checks and Prometheus can reach it without exposing it on the
  # public API port. Keep this port on the internal network only.
  server:
    port: ${MANAGEMENT_PORT:8086}
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
    metrics:
      access: READ_ONLY
    prometheus:
      access: READ_ONLY

  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,metrics,prometheus
        exclude: env,shutdown,heapdump

  metrics:
    tags:
      application: ${spring.application.name}
      version: ${spring.application.version}

  tracing:
    sampling:
      probability: ${TRACING_PROBABILITY:0.1}  # 1.0 for development

  otlp:
    metrics:
      export:
        enabled: ${OTLP_ENABLED:false}
        url: ${OTLP_URL:http://localhost:4318}/v1/metrics

  opentelemetry:
    tracing:
      export:
        otlp:
          enabled: ${OTLP_ENABLED:false}
          endpoint: ${OTLP_URL:http://localhost:4318}/v1/traces

    logging:
      export:
        otlp:
          enabled: ${OTLP_ENABLED:false}
          endpoint: ${OTLP_URL:http://localhost:4318}/v1/logs
app:
  # Browser origins of the portals and the signing portal (see bw.co.starsign.security.CorsProperties)
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4700}
  rate-limit: ${RATE_LIMIT:20}
  # Per client (token subject, or IP when anonymous); see bw.co.starsign.ratelimit.RateLimitProperties
  rate-limiting:
    enabled: ${RATE_LIMIT_ENABLED:true}
    requests-per-second: ${app.rate-limit}
    rules:
      # Organisation self-registration
      - name: register
        method: POST
        pattern: /organisations
        capacity: ${RATE_LIMIT_REGISTER:5}
        period: 1h
      # External signing portal: invitation lookups by token (guessing protection)
      - name: signing-invitation
        pattern: /signing/invitations/**
        capacity: ${RATE_LIMIT_SIGNING:60}
        period: 1m
      # One-time passwords sent by email / SMS, and their confirmation (** also matches /verify itself)
      - name: signing-verification
        method: POST
        pattern: /signing/invitations/*/verify/**
        capacity: ${RATE_LIMIT_OTP:5}
        period: 15m
      # Independent integrity verification uploads
      - name: verify-file
        method: POST
        pattern: /documents/verify
        capacity: ${RATE_LIMIT_VERIFY:20}
        period: 10m
  # Keycloak Authorization Services (resources, scopes, policies) of the starsign-api client,
  # generated by keycloak/generate_authz.py
  keycloak:
    authz:
      server-url: ${AUTH_URL:http://localhost:8080}
      realm: ${REALM:starsign}
      client-id: ${API_CLIENT_ID:starsign-api}
      client-secret: ${STARSIGN_API_CLIENT_SECRET:starsign-api-secret}
      permission-cache-ttl: ${AUTHZ_PERMISSION_CACHE_TTL:5m}
      # In-process Caffeine cache (L1) in front of Redis (L2)
      local-cache-ttl: ${AUTHZ_LOCAL_CACHE_TTL:1m}
      local-cache-max-size: ${AUTHZ_LOCAL_CACHE_MAX_SIZE:10000}
  # Object storage buckets (bw.co.starsign.storage)
  storage:
    provider: ${STORAGE_PROVIDER:SEAWEEDFS_S3}
    bucket: ${S3_BUCKET:starsign-documents}
    # Buckets are created on startup when missing (local development)
    create-buckets: ${S3_CREATE_BUCKETS:true}
  # Email and SMS delivery through Novu (bw.co.starsign.notification); same client as knowvera
  novu:
    enabled: ${NOVU_ENABLED:false}
    # NOVU_API_KEY is accepted too (the name Novu's dashboard uses for the secret key)
    secret-key: ${NOVU_SECRET_KEY:${NOVU_API_KEY:}}
    base-url: ${NOVU_BASE_URL:https://api.novu.co}
    # Novu workflow id per notification event: <prefix><event-type in kebab case>, e.g. starsign-signing-invitation
    workflow-prefix: ${NOVU_WORKFLOW_PREFIX:starsign-}
  # PDF stamping and PAdES signatures (bw.co.starsign.signing.PdfSigningEngineImpl)
  signing:
    keystore-path: ${SIGNING_KEYSTORE_PATH:./data/signing/starsign-dev.p12}
    keystore-password: ${SIGNING_KEYSTORE_PASSWORD:changeit}
    key-alias: ${SIGNING_KEY_ALIAS:starsign}
    # Generates a self-signed keystore at keystore-path when missing; never in production
    generate-dev-keystore: ${SIGNING_GENERATE_DEV_KEYSTORE:true}
    # Optional RFC 3161 timestamp authority
    tsa-url: ${SIGNING_TSA_URL:}
    # Completed documents are certified with "no changes allowed" (DocMDP P=1)
    certify-final: ${SIGNING_CERTIFY_FINAL:true}
    # Long-term validation: certificates + OCSP/CRL in a DSS, and a document timestamp when tsa-url is set
    ltv: ${SIGNING_LTV:true}
    revocation-timeout-seconds: ${SIGNING_REVOCATION_TIMEOUT_SECONDS:10}
  # Links in invitation emails
  portal-url: ${PORTAL_URL:http://localhost:4700}
  signing-portal-url: ${SIGNING_PORTAL_URL:http://localhost:4700/sign}
  # Where browsers reach the API, for direct links such as a signatory's completed-copy download;
  # blank = <portal-url>/api (the portal proxies /api to the webservice)
  public-api-url: ${PUBLIC_API_URL:}
  # Keycloak Admin API (user provisioning) through the starsign-api service account
  keycloak-admin:
    server-url: ${AUTH_URL:http://localhost:8080}
    realm: ${REALM:starsign}
    client-id: ${API_CLIENT_ID:starsign-api}
    client-secret: ${STARSIGN_API_CLIENT_SECRET:starsign-api-secret}
